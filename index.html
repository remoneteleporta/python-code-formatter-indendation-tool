<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Python Indentation Fixer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Python Indentation Fixer</h1>
            <p class="subtitle">Automatically detect and fix Python indentation based on syntax</p>
        </header>

        <div class="settings">
            <div class="setting-group">
                <label for="indentSize">Indent Size:</label>
                <input type="number" id="indentSize" value="4" min="1" max="8">
                <span>spaces</span>
            </div>
        </div>

        <div class="main-content">
            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title">Input Code</h2>
                    <button class="btn btn-primary" onclick="fixIndentation()">Fix Indentation</button>
                </div>
                <div class="code-area">
                    <textarea id="inputCode" placeholder="Paste your Python code here..."></textarea>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title">Fixed Code</h2>
                    <button class="btn btn-secondary" onclick="copyToClipboard()">Copy Code</button>
                </div>
                <div class="code-area">
                    <pre id="outputCode">Fixed code will appear here...</pre>
                </div>
                <div id="statusMessage" class="status info hidden"></div>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
