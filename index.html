<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Python Formatter SPA</title>
    <link rel="stylesheet" href="styles.css">

    <!-- Pyodide -->
    <script defer src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>

    <!-- DOMPurify -->
    <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.2/dist/purify.min.js"></script>

    <!-- Highlight.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>

    <!-- App -->
    <script defer src="main.js"></script>

</head>
<body>
    <h1>Python Formatter</h1>
<div id="io">
<section id="input-section">
    <h3>Input Code:</h3>
    <textarea id="input" placeholder="Paste Python code..."></textarea>
    <button id="formatBtn" disabled>Format Code</button>
</section>
<section id="output-section">
    <h3>
        Output:
    </h3>
    <button id="copyBtn">Copy</button>
    <pre><code id="output" class="language-python"></code></pre>
</section>
</div>
</body>
</html>
